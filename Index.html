<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Web Chat</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121214;
            color: #e1e1e6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #chat-container {
            width: 100%;
            max-width: 450px;
            height: 85vh;
            background: #1c1c1f;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Schermata di Login */
        #login-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            flex: 1;
            padding: 2rem;
            text-align: center;
        }

        #login-screen h2 {
            margin-bottom: 1.5rem;
            color: #4ea8de;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            background: #29292e;
            border: 2px solid #323238;
            border-radius: 6px;
            color: #fff;
            font-size: 1rem;
            margin-bottom: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: #4ea8de;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #4ea8de;
            border: none;
            border-radius: 6px;
            color: #121214;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #5fa8de;
        }

        /* Schermata Chat principale */
        #chat-screen {
            display: none;
            flex-direction: column;
            flex: 1;
            height: 100%;
        }

        #chat-header {
            background: #29292e;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            border-bottom: 1px solid #323238;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #user-display {
            color: #4ea8de;
        }

        #messages-area {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Stili dei Messaggi */
        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 8px;
            line-height: 1.4;
            position: relative;
            word-wrap: break-word;
        }

        .message .username {
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 3px;
            display: block;
        }

        .message.sent {
            background: #0077b6;
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .message.sent .username {
            color: #90e0ef;
        }

        .message.received {
            background: #29292e;
            color: #e1e1e6;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .message.received .username {
            color: #4ea8de;
        }

        #input-area {
            padding: 15px;
            background: #29292e;
            display: flex;
            gap: 10px;
            border-top: 1px solid #323238;
        }

        #message-input {
            margin-bottom: 0;
            flex: 1;
        }

        #send-btn {
            width: auto;
            padding: 0 20px;
        }
    </style>
</head>
<body>

    <div id="chat-container">
        <!-- Schermata di Accesso -->
        <div id="login-screen">
            <h2>Scegli un nome utente</h2>
            <input type="text" id="username-input" placeholder="Inserisci il tuo nome..." autocomplete="off">
            <button id="login-btn">Entra nella Chat</button>
        </div>

        <!-- Schermata della Chat -->
        <div id="chat-screen">
            <div id="chat-header">
                <span>Stanza Globale</span>
                <span id="user-display"></span>
            </div>
            <div id="messages-area"></div>
            <div id="input-area">
                <input type="text" id="message-input" placeholder="Scrivi un messaggio..." autocomplete="off">
                <button id="send-btn">Invia</button>
            </div>
        </div>
    </div>

    <script>
        let currentUser = "";

        // Elementi DOM
        const loginScreen = document.getElementById('login-screen');
        const chatScreen = document.getElementById('chat-screen');
        const usernameInput = document.getElementById('username-input');
        const loginBtn = document.getElementById('login-btn');
        const userDisplay = document.getElementById('user-display');
        const messagesArea = document.getElementById('messages-area');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');

        // Accedi alla chat
        loginBtn.addEventListener('click', login);
        usernameInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') login(); });

        function login() {
            const user = usernameInput.value.trim();
            if (user) {
                currentUser = user;
                userDisplay.textContent = `@${currentUser}`;
                loginScreen.style.display = 'none';
                chatScreen.style.display = 'flex';
                loadMessages();
                messagesArea.scrollTop = messagesArea.scrollHeight;
            }
        }

        // Carica e renderizza i messaggi dal localStorage
        function loadMessages() {
            messagesArea.innerHTML = "";
            const messages = JSON.parse(localStorage.getItem('local_chat_messages')) || [];
            
            messages.forEach(msg => {
                const msgDiv = document.createElement('div');
                msgDiv.classList.add('message');
                
                if (msg.sender === currentUser) {
                    msgDiv.classList.add('sent');
                } else {
                    msgDiv.classList.add('received');
                }

                msgDiv.innerHTML = `<span class="username">${msg.sender}</span>${msg.text}`;
                messagesArea.appendChild(msgDiv);
            });
        }

        // Invia un nuovo messaggio
        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;

            const messages = JSON.parse(localStorage.getItem('local_chat_messages')) || [];
            const newMessage = {
                sender: currentUser,
                text: text,
                timestamp: Date.now()
            };

            messages.push(newMessage);
            localStorage.setItem('local_chat_messages', JSON.stringify(messages));
            
            messageInput.value = "";
            loadMessages();
            messagesArea.scrollTop = messagesArea.scrollHeight;
        }

        // Ascolta i cambiamenti nel localStorage per aggiornare la chat in tempo reale tra le schede
        window.addEventListener('storage', (e) => {
            if (e.key === 'local_chat_messages') {
                loadMessages();
                messagesArea.scrollTop = messagesArea.scrollHeight;
            }
        });
    </script>
</body>
</html>
